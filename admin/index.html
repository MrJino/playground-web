<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../favicon.ico" type="image/x-icon" />
    <title>Playground Admin</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="admin-home-body">
    <main class="admin-home-page">
      <div class="admin-home-inner">
        <header class="admin-home-header fade-in">
          <div class="admin-brand">
            <img src="../assets/icons/admin_icon.png" alt="" class="admin-brand__icon" aria-hidden="true" />
            <span class="admin-brand__text">
              <strong>Admin</strong>
            </span>
          </div>
        </header>

        <section class="admin-app-grid" aria-label="관리 페이지 메뉴">
          <a class="admin-app-card fade-in delay-1" href="./pick-your-favorite/">
            <div class="admin-app-card__icon">P</div>
            <h2>Pick Your Favorite</h2>
            <p>Favorite topics와 cards 데이터를 관리합니다.</p>
          </a>

          <a class="admin-app-card fade-in delay-2" href="./typing-game/">
            <div class="admin-app-card__icon">T</div>
            <h2>Typing Game</h2>
            <p>타자 게임 데이터 관리 페이지입니다.</p>
          </a>

          <a class="admin-app-card fade-in delay-3" href="./words-quiz/">
            <div class="admin-app-card__icon">W</div>
            <h2>Words Quiz</h2>
            <p>Topics와 quiz words 데이터를 관리합니다.</p>
          </a>
        </section>

        <footer class="admin-home-footer fade-in delay-1">
          <p class="admin-footer-text">
            <a href="../">Playground</a> by <a href="https://mrjino.github.io/" target="_blank" rel="noopener noreferrer">MrJino</a>. All rights reserved
          </p>
        </footer>
      </div>
    </main>
  </body>
</html>
