<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../favicon.ico" type="image/x-icon" />
    <title>Pick your favorite</title>
    <link rel="stylesheet" href="./styles.css" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2370597715066024" crossorigin="anonymous"></script>
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <div class="hero-placeholder" id="heroPlaceholder" hidden>
          <a class="hero-placeholder__link" href="../" aria-label="홈으로 이동">
            <img class="hero-placeholder__image" src="../assets/icons/profile_jino.png" alt="Pick your favorite" />
          </a>
          <fieldset class="country-filter" data-country-dropdown aria-label="국가 선택">
            <legend>국가</legend>
            <button class="country-filter__trigger" id="countryDropdownButton" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span id="countryDropdownLabel">전체</span>
              <span class="country-filter__chevron" aria-hidden="true"></span>
            </button>
            <div class="country-filter__menu" role="listbox" aria-labelledby="countryDropdownButton" hidden>
              <button class="country-filter__option is-active" type="button" role="option" data-country-filter="all" aria-selected="true">전체</button>
              <button class="country-filter__option" type="button" role="option" data-country-filter="kr" aria-selected="false">한국</button>
              <button class="country-filter__option" type="button" role="option" data-country-filter="us" aria-selected="false">미국</button>
            </div>
          </fieldset>
          <div class="hero-language" data-language-dropdown>
            <button class="hero-language__trigger" id="languageDropdownButton" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span id="languageDropdownLabel">한글</span>
              <span class="hero-language__chevron" aria-hidden="true"></span>
            </button>
            <div class="hero-language__menu" role="listbox" aria-labelledby="languageDropdownButton" hidden>
              <button class="hero-language__option is-active" type="button" role="option" data-language-option="ko" aria-selected="true">한글</button>
              <button class="hero-language__option" type="button" role="option" data-language-option="en" aria-selected="false">English</button>
            </div>
          </div>
        </div>
        <div class="pool-scroll" id="poolScroll">
          <div class="pool-grid" id="poolGrid"></div>
        </div>
      </header>

      <section class="content-layout">
        <aside class="menu-panel" id="menuPanel">
          <div class="menu-panel__header">
            <div class="menu-panel__title">메뉴트리</div>
            <button class="menu-panel__search" id="openMenuSearchButton" type="button">전체메뉴 검색하기</button>
          </div>
          <div id="menuList"></div>
        </aside>

        <section class="menu-browser-panel" id="menuBrowserPanel" hidden>
          <div class="menu-browser__top">
            <div>
              <h2>메뉴 선택</h2>
              <p>원하는 월드컵 메뉴를 골라 시작하세요.</p>
            </div>
            <label class="menu-search">
              <span>메뉴 검색</span>
              <input id="menuSearchInput" type="search" placeholder="예: 미국, 2020, 여가수" autocomplete="off" />
            </label>
          </div>
          <div class="menu-browser-grid" id="menuBrowserGrid"></div>
        </section>

        <section class="battle-panel" id="battlePanel">
          <div class="battle-top">
            <h2 id="battleTitle"></h2>
            <div class="progress" id="progressText"></div>
          </div>

          <div class="battle-intro" id="battleIntroPanel" hidden>
            <h3 id="battleIntroTitle">배틀 준비 완료</h3>
            <button class="battle-intro__start" id="battleStartButton" type="button">배틀시작</button>
          </div>

          <div class="battle-grid" id="battleGrid" hidden>
            <article class="battle-card" data-side="left" id="leftCard" role="button" tabindex="0">
              <img class="battle-card__image" id="leftImage" alt="" />
              <h3 id="leftTitle"></h3>
              <p id="leftText"></p>
              <div class="battle-card__source" id="leftSource"></div>
            </article>

            <article class="battle-card" data-side="right" id="rightCard" role="button" tabindex="0">
              <img class="battle-card__image" id="rightImage" alt="" />
              <h3 id="rightTitle"></h3>
              <p id="rightText"></p>
              <div class="battle-card__source" id="rightSource"></div>
            </article>
          </div>
        </section>

        <aside class="history-panel" id="historyPanel">
          <section class="history-section history-section--ranking" id="menuRankingSection" hidden>
            <div class="history-panel__top">
              <div>
                <div class="history-panel__eyebrow">Ranking</div>
                <h2 class="history-panel__title">메뉴 랭킹</h2>
              </div>
              <a class="ranking-link" id="rankingButton" href="./ranking/?menu=boy-idol">전체보기</a>
            </div>
            <div class="ranking-list ranking-list--panel" id="menuRankingList" aria-live="polite"></div>
          </section>

          <section class="history-section history-section--local">
            <div class="history-panel__top">
              <div>
                <div class="history-panel__eyebrow">LocalStorage</div>
                <h2 class="history-panel__title">Final Cards</h2>
              </div>
              <button class="history-panel__clear" id="clearHistoryButton" type="button">전체삭제</button>
            </div>
            <div class="history-list" id="historyList"></div>
          </section>
        </aside>
      </section>

      <nav class="mobile-nav" aria-label="모바일 패널 메뉴">
        <button class="mobile-nav__button" id="openMobileSearchButton" type="button" aria-controls="menuBrowserPanel">
          <span class="mobile-nav__icon mobile-nav__icon--search"></span>
          <span>검색</span>
        </button>
        <button class="mobile-nav__button" id="openMobileMenuButton" type="button" aria-controls="menuPanel" aria-expanded="false">
          <span class="mobile-nav__icon mobile-nav__icon--menu"></span>
          <span>메뉴</span>
        </button>
        <button class="mobile-nav__button" id="openMobileHistoryButton" type="button" aria-controls="historyPanel" aria-expanded="false">
          <span class="mobile-nav__icon mobile-nav__icon--history"></span>
          <span>기록</span>
        </button>
      </nav>
    </main>

    <div class="mobile-panel-backdrop" id="mobilePanelBackdrop" hidden></div>

    <div class="confirm-modal" id="confirmModal" hidden>
      <div class="confirm-modal__backdrop" data-close-confirm-modal></div>
      <div class="confirm-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle" aria-describedby="confirmModalMessage">
        <h2 class="confirm-modal__title" id="confirmModalTitle">삭제 확인</h2>
        <p class="confirm-modal__message" id="confirmModalMessage">정말 삭제하시겠습니까?</p>
        <div class="confirm-modal__actions">
          <button class="confirm-modal__button confirm-modal__button--secondary" id="cancelConfirmButton" type="button">아니오</button>
          <button class="confirm-modal__button confirm-modal__button--primary" id="acceptConfirmButton" type="button">예</button>
        </div>
      </div>
    </div>

    <script src="../shared/cloudflare-api.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
