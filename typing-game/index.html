<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>8-bit Typing Defender</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <aside class="menu-panel" id="menuPanel" aria-label="타자 게임 메뉴">
        <div class="menu-panel__header">
          <div class="menu-panel__title">Menu</div>
        </div>
        <div class="language-select" aria-label="게임 언어 선택">
          <button class="language-button is-active" type="button" data-language="ko">한글</button>
          <button class="language-button" type="button" data-language="en">English</button>
        </div>
        <div class="menu-list">
          <section class="menu-section">
            <div class="menu-group">2020년대</div>
            <div class="submenu">
              <button class="menu-item is-active" type="button" data-word-menu="boy-idol-name" aria-current="true">남자아이돌 이름</button>
              <button class="menu-item" type="button" data-word-menu="girl-idol-name" aria-current="false">여자아이돌 이름</button>
            </div>
          </section>
          <section class="menu-section">
            <div class="menu-group">기타</div>
            <div class="submenu">
              <button class="menu-item" type="button" data-word-menu="food" aria-current="false">음식관련단어</button>
              <button class="menu-item" type="button" data-word-menu="mood" aria-current="false">기분관련단어</button>
              <button class="menu-item" type="button" data-word-menu="animal" aria-current="false">동물관련단어</button>
              <button class="menu-item" type="button" data-word-menu="transport" aria-current="false">교통수단관련단어</button>
              <button class="menu-item" type="button" data-word-menu="country" aria-current="false">나라이름관련단어</button>
              <button class="menu-item" type="button" data-word-menu="capital" aria-current="false">각나라수도이름</button>
              <button class="menu-item" type="button" data-word-menu="all" aria-current="false">무작위 모든단어</button>
            </div>
          </section>
        </div>
      </aside>

      <section class="game-card" aria-label="타자연습 미사일 게임">
        <div class="hud">
          <div class="hud__item hud__item--menu">
            <span class="hud__label">MENU</span>
            <strong id="selectedMenuText">남자아이돌 이름</strong>
          </div>
          <div class="hud__item">
            <span class="hud__label">SCORE</span>
            <strong id="scoreText">0000</strong>
          </div>
          <div class="hud__item">
            <span class="hud__label">LIFE</span>
            <strong id="lifeText">★★★</strong>
          </div>
          <div class="hud__item">
            <span class="hud__label">LEVEL</span>
            <strong id="levelText">1</strong>
          </div>
        </div>

        <div class="screen-wrap">
          <canvas id="gameCanvas" width="960" height="620" aria-label="상단에서 글자가 내려오는 게임 화면"></canvas>
          <div class="scanlines"></div>
          <label class="input-catcher">
            <input
              id="typingInput"
              name="typingGameInput"
              type="search"
              inputmode="search"
              enterkeyhint="done"
              autocomplete="off"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              placeholder="단어 입력"
              readonly
              onfocus="this.removeAttribute('readonly')"
            />
          </label>
          <div class="start-panel" id="startPanel">
            <h1>TYPE DEFENDER</h1>
            <p>떨어지는 글자를 입력해서 미사일로 격추하세요.</p>
            <button id="startButton" type="button">START</button>
          </div>
          <div class="game-over-panel" id="gameOverPanel" hidden>
            <h2>GAME OVER</h2>
            <p id="finalScoreText">SCORE 0000</p>
            <button id="restartButton" type="button">RESTART</button>
          </div>
        </div>
      </section>

      <aside class="history-panel" id="historyPanel" aria-label="타자 게임 기록">
        <section class="history-section history-section--local">
          <div class="history-panel__top">
            <div>
              <div class="history-panel__eyebrow">LocalStorage</div>
              <h2 class="history-panel__title">Game History</h2>
            </div>
            <button class="history-panel__clear" id="clearHistoryButton" type="button">전체삭제</button>
          </div>
          <div class="history-list" id="historyList"></div>
        </section>
      </aside>

      <nav class="mobile-nav" aria-label="모바일 패널 메뉴">
        <button class="mobile-nav__button" id="openMobileMenuButton" type="button" aria-controls="menuPanel" aria-expanded="false">
          <span class="mobile-nav__icon mobile-nav__icon--menu"></span>
          <span>메뉴</span>
        </button>
        <button class="mobile-nav__button" id="openMobileHistoryButton" type="button" aria-controls="historyPanel" aria-expanded="false">
          <span class="mobile-nav__icon mobile-nav__icon--history"></span>
          <span>기록</span>
        </button>
      </nav>
    </main>

    <div class="mobile-panel-backdrop" id="mobilePanelBackdrop" hidden></div>

    <div class="confirm-modal" id="confirmModal" hidden>
      <div class="confirm-modal__backdrop" data-close-confirm-modal></div>
      <div class="confirm-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle">
        <h2 class="confirm-modal__title" id="confirmModalTitle">새 게임</h2>
        <p class="confirm-modal__message" id="confirmModalMessage"></p>
        <div class="confirm-modal__actions">
          <button class="confirm-modal__button confirm-modal__button--secondary" id="cancelConfirmButton" type="button">아니오</button>
          <button class="confirm-modal__button confirm-modal__button--primary" id="acceptConfirmButton" type="button">예</button>
        </div>
      </div>
    </div>

    <script src="./game.js"></script>
  </body>
</html>
