<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../favicon.ico" type="image/x-icon" />
    <title>Words Quiz</title>
    <link rel="stylesheet" href="../shared/confirm-dialog.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <div class="hero-placeholder">
          <a class="hero-placeholder__link" href="../" aria-label="홈으로 이동">
            <img class="hero-placeholder__image" src="../assets/icons/game.png" alt="Words Quiz" />
          </a>
          <div class="hero-placeholder__content"></div>
          <div class="hero-actions">
            <button class="hero-action-button" id="openAdminConfirmButton" type="button">Admin</button>
          </div>
        </div>
      </header>

      <section class="content-layout">
        <aside class="menu-panel" aria-label="단어 목록">
          <div class="menu-panel__header">
            <div class="menu-panel__title">메뉴트리</div>
            <button class="menu-panel__search" id="openTopicSearchButton" type="button">전체토픽 검색하기</button>
          </div>
          <div class="topic-list" id="topicList"></div>
        </aside>

        <section class="topic-browser-panel" id="topicBrowserPanel" hidden>
          <div class="topic-browser__top">
            <div>
              <h2>토픽 선택</h2>
              <p>원하는 퀴즈 토픽을 골라 시작하세요.</p>
            </div>
            <label class="topic-search">
              <span>토픽 검색</span>
              <input id="topicSearchInput" type="search" placeholder="예: CS, 네트워크, 영어" autocomplete="off" />
            </label>
          </div>
          <div class="topic-browser-grid" id="topicBrowserGrid"></div>
        </section>

        <section class="battle-panel quiz-card" aria-live="polite">
          <div class="quiz-intro" id="quizIntroPanel">
            <h2 id="quizIntroTitle"></h2>
            <button class="quiz-intro__start" id="quizStartButton" type="button" disabled>퀴즈시작</button>
          </div>

          <div class="quiz-play-area" id="quizPlayArea" hidden>
            <div class="prompt-card">
              <strong id="abbreviationText">API</strong>
            </div>

            <form class="answer-form" id="answerForm">
              <div class="answer-row">
                <div class="answer-inputs" id="answerInputs"></div>
              </div>
              <button class="primary-button answer-submit" type="submit" form="answerForm">확인</button>
            </form>

            <div class="feedback" id="feedbackBox" hidden>
              <div class="feedback__result" id="feedbackResult"></div>
              <div class="feedback__answer" id="feedbackAnswer"></div>
              <div class="description-panel">
                <button class="description-edit-button" id="descriptionEditButton" type="button" aria-label="설명 편집" title="설명 편집" hidden>✎</button>
                <p id="descriptionText"></p>
              </div>
            </div>

            <div class="quiz-actions">
              <div class="round-meta">
                <span id="roundText">1 / 1</span>
                <span id="accuracyText">정답률 0%</span>
              </div>
              <div class="quiz-actions__controls">
                <button class="ghost-button" id="skipButton" type="button">건너뛰기</button>
                <button class="ghost-button" id="hintButton" type="button">힌트</button>
              </div>
            </div>
          </div>
        </section>

        <aside class="history-panel" aria-label="풀이 기록">
          <section class="history-section history-section--local">
            <div class="history-panel__top">
              <div>
                <p class="history-panel__eyebrow">History</p>
                <h2 class="history-panel__title">최근 풀이</h2>
              </div>
              <button class="ghost-button" id="resetButton" type="button">초기화</button>
            </div>
            <div class="history-list" id="historyList"></div>
          </section>
        </aside>
      </section>
    </main>

    <dialog class="description-dialog" id="descriptionEditDialog">
      <form class="description-dialog__form" id="descriptionEditForm" method="dialog">
        <div class="description-dialog__top">
          <h2>설명 편집</h2>
          <button class="description-dialog__close" id="descriptionEditCancelButton" type="button" aria-label="닫기">×</button>
        </div>
        <textarea id="descriptionEditInput" rows="8" aria-label="설명"></textarea>
        <p class="description-dialog__message" id="descriptionEditMessage" aria-live="polite"></p>
        <div class="description-dialog__actions">
          <button class="ghost-button" type="button" id="descriptionEditCancelAction">취소</button>
          <button class="primary-button" type="submit">저장</button>
        </div>
      </form>
    </dialog>

    <script src="../shared/confirm-dialog.js"></script>
    <script src="../shared/cloudflare-api.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
